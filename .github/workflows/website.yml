name: Deploy Tokens Kanban Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assets/**"
      - "docs/changelog/**"
      - ".github/assets/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site and preserve existing public asset URLs
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/assets/badges"
          cp -a website/. "$site/"
          cp -a docs/changelog "$site/"
          cp -a docs/assets/screenshots "$site/assets/device-screens"
          cp docs/assets/readme-preview.png .github/assets/open-device-manager.svg "$site/assets/"
          cp .github/assets/{downloads,license,macos,release,rtos,windows}.svg "$site/assets/badges/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
